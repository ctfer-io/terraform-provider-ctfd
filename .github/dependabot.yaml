version: 2
updates:
  # Github actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  
  # Root Go module
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "pandatix"
    groups:
      # interdependencies between plugin modules
      hashicorp-terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
